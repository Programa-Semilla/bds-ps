# Single-VM deployment for capitalsemilla-dev.programasemilla.com
# Fixed-cost alternative to the Azure Container Apps stack.
#
#   caddy   -> auto-TLS reverse proxy (Let's Encrypt), ports 80/443
#   webapp  -> the .NET 10 app (existing src/FundingPlatform.Web/Dockerfile)
#   mssql   -> SQL Server 2022 (Developer edition, free for non-prod)
#
# Storage uses the LocalFilesystem provider (no Azure Blob bill). All state
# lives in named volumes on the VM's data disk; back them up with backup.sh.
name: capitalsemilla

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp

  webapp:
    build:
      # Build context is the repo root — the Dockerfile COPYs from repo root
      # (slnx, src/, prompts/, schemas/).
      context: ../..
      dockerfile: src/FundingPlatform.Web/Dockerfile
    image: capitalsemilla-webapp:local
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      # OpenTelemetry export -> Aspire Dashboard. Empty by default (ServiceDefaults
      # only wires the OTLP exporter when this is non-empty). To view telemetry,
      # set OTEL_ENDPOINT=http://aspire-dashboard:18889 in .env and start the
      # dashboard: docker compose --profile debug up -d aspire-dashboard
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: webapp
      # DB: SA auth against the mssql container on the private compose network.
      ConnectionStrings__fundingdb: "Server=mssql,1433;Database=fundingdb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      # Attachments storage. Default AzureBlob — durable (survives VM loss) and
      # cheap (~cents/GB; storage was never the cost problem, Log Analytics was).
      # Set STORAGE_PROVIDER=LocalFilesystem in .env to keep files on the VM disk.
      Storage__Provider: ${STORAGE_PROVIDER:-AzureBlob}
      Storage__LocalFilesystem__RootPath: /data/storage
      # AzureBlob auth. Put the blob ENDPOINT URI here
      # (https://<account>.blob.core.windows.net) to use the VM's managed identity
      # — no secret on disk, and the Production storage guard stays Healthy because
      # it only flags a key in Storage:ConnectionString. A full account connection
      # string also works (key auth). Empty for LocalFilesystem.
      ConnectionStrings__blobs: ${BLOB_CONNECTION:-}
      # Notifications: off by default (NoOp). Two ways to enable real mail — see
      # .env.example for the full matrix:
      #   NOTIFICATIONS_PROVIDER=Mailgun   -> Mailgun HTTP API (needs a Sending API key)
      #   NOTIFICATIONS_PROVIDER=Mailtrap  -> generic SMTP sender (MailKit); works
      #                                       against smtp.mailgun.org:587 with the
      #                                       domain's SMTP login/password.
      # "Mailtrap" is just the spec-021 switch value for the SMTP sender; the host
      # it talks to is whatever SMTP_HOST points at.
      Notifications__Provider: ${NOTIFICATIONS_PROVIDER:-NoOp}
      Notifications__BaseUrl: https://${APP_DOMAIN}
      Notifications__Mailgun__ApiKey: ${MAILGUN_API_KEY:-}
      Notifications__Mailgun__Domain: ${MAILGUN_DOMAIN:-}
      Notifications__Mailgun__BaseUrl: ${MAILGUN_BASE_URL:-https://api.mailgun.net/v3}
      # SMTP path. Port drives TLS policy in MailtrapSmtpEmailSender:
      # 25 -> none, 465 -> implicit TLS, anything else (587) -> STARTTLS.
      Notifications__Mailtrap__Host: ${SMTP_HOST:-localhost}
      Notifications__Mailtrap__Port: ${SMTP_PORT:-25}
      Notifications__Mailtrap__Username: ${SMTP_USERNAME:-}
      Notifications__Mailtrap__Password: ${SMTP_PASSWORD:-}
      Notifications__Sender__Name: ${NOTIFICATIONS_SENDER_NAME:-Programa Semilla / Sistema de Banca para el Desarrollo}
      Notifications__Sender__Email: ${NOTIFICATIONS_SENDER_EMAIL:-no-reply@programa-semilla.cr}
      # SECOND email stack (spec 021-feedback-session-may13). The direct-send
      # identity/stage/supplier emails — set-password invitation, forgot-password,
      # password-changed, stage reminders — resolve
      # Application.Abstractions.IEmailSender, which Infrastructure/DependencyInjection.cs
      # binds off Smtp:Host: empty => LoggingEmailSender (logs, never sends).
      # Notifications__* does NOT drive this path. Same credentials, both stacks.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__UseSsl: "true"
      # Must be on the verified sending domain or the relay rejects the message.
      Smtp__FromAddress: ${NOTIFICATIONS_SENDER_EMAIL:-no-reply@programa-semilla.cr}
      # AI quote comparison (spec 020). Default Stub (no key, fake output) so a
      # keyless deploy works — provider=Anthropic *requires* a key or the client
      # ctor throws and both the worker and the /Review comparison region 500.
      # For real AI: set AI_PROVIDER=Anthropic and ANTHROPIC_API_KEY in .env.
      AiComparison__Provider: ${AI_PROVIDER:-Stub}
      AiComparison__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      AiComparison__WorkerIdleDelaySeconds: "10"
      # Log levels pinned for parity with the old Container Apps env (cost guard).
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      # Raise to Debug in .env to trace the email path (endpoint resolution +
      # per-send outcome) when diagnosing delivery issues; keep at Warning
      # normally — the log-cost guard.
      Logging__LogLevel__FundingPlatform.Infrastructure.Notifications: ${LOG_NOTIFICATIONS:-Warning}
      Logging__LogLevel__FundingPlatform.Web.Controllers.Admin: ${LOG_ADMIN:-Warning}
      # Information (one line per direct-send email) so a silently-swallowed
      # send is visible. LoggingEmailSender — the no-transport fallback — also
      # logs here; if you see "[LoggingEmailSender]" then Smtp:Host is unset
      # and nothing is actually being delivered.
      Logging__LogLevel__FundingPlatform.Infrastructure.Email: ${LOG_EMAIL:-Information}
      Logging__LogLevel__FundingPlatform.Application.Services: Information
      Notifications__Worker__PollIntervalSeconds: "30"
      AdminReports__DefaultCurrency: CRC
      AdminReports__CsvRowLimit: "50000"
      FundingAgreement__LocaleCode: es-CR
      # Funder identity printed on generated agreement PDFs (ported from the old
      # azd env). Falls back to appsettings placeholders if unset.
      FundingAgreement__Funder__LegalName: ${FUNDER_LEGALNAME:-}
      FundingAgreement__Funder__TaxId: ${FUNDER_TAXID:-}
      FundingAgreement__Funder__Address: ${FUNDER_ADDRESS:-}
      FundingAgreement__Funder__ContactEmail: ${FUNDER_CONTACTEMAIL:-}
      FundingAgreement__Funder__ContactPhone: ${FUNDER_CONTACTPHONE:-}
      FundingAgreement__CurrencyIsoCode: CRC
      SignedUpload__MaxSizeBytes: "20971520"
      Syncfusion__LicenseKey: ${SYNCFUSION_LICENSE_KEY}
      Admin__DefaultPassword: ${ADMIN_DEFAULT_PASSWORD}
      # Ybug feedback widget (temporary). Only rendered on deployed environments —
      # the view also requires environment != Development, so local/E2E runs never
      # load it. Blank YBUG_ID= in .env to switch the widget off without a code change.
      Ybug__Id: ${YBUG_ID:-rhpksjxja754ms2dy40z}
    volumes:
      - app_storage:/data/storage
      # Persist ASP.NET DataProtection keys across container recreates. Without
      # this, every deploy wipes the keyring -> all auth cookies + antiforgery
      # tokens invalidate (everyone logged out) and DP-encrypted data is lost.
      # (Azure Container Apps did this via runtime.dotnet autoConfigureDataProtection.)
      - dataprotection:/root/.aspnet/DataProtection-Keys

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    # Bind to loopback only — SQL never faces the public internet. Reach it for
    # dacpac publishing via an SSH tunnel (see publish-dacpac-vm.sh).
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      # Cap the SQL buffer pool so the webapp (+ Syncfusion Chromium) has headroom
      # on the 4 GB VM (Standard_B2als_v2). Raise if you move to a larger VM.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # On-demand only (profile: debug). In-memory telemetry viewer — structured
  # logs, traces, metrics. Nothing persisted, nothing to pay for: all state is
  # RAM and evaporates on restart. Bound to loopback; reach the UI through an
  # SSH tunnel:  ssh -L 18888:localhost:18888 azureuser@<VM IP>  then open
  # http://localhost:18888
  #
  # Start:  docker compose --profile debug up -d aspire-dashboard
  # Stop:   docker compose --profile debug down  (or stop just this service)
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    profiles: ["debug"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18888:18888"   # web UI (loopback only -> SSH tunnel)
    environment:
      # No auth: safe only because the UI is loopback-bound and OTLP ingest is
      # reachable solely on the private compose network.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:18889
      # Bound buffers ~= "recent only". Lower = less RAM. Oldest auto-evicted.
      DASHBOARD__TELEMETRYLIMITS__MAXLOGCOUNT: "5000"
      DASHBOARD__TELEMETRYLIMITS__MAXTRACECOUNT: "5000"
      DASHBOARD__TELEMETRYLIMITS__MAXMETRICSCOUNT: "5000"

volumes:
  caddy_data:
  caddy_config:
  mssql_data:
  app_storage:
  dataprotection:
