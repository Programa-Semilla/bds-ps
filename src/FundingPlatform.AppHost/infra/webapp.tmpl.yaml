api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: 8080
      transport: http
      allowInsecure: false
      {{- if and .Env.WEBAPP_CUSTOM_DOMAIN .Env.WEBAPP_CUSTOM_DOMAIN_CERTIFICATE_ID }}
      customDomains:
        - name: {{ .Env.WEBAPP_CUSTOM_DOMAIN }}
          certificateId: {{ .Env.WEBAPP_CUSTOM_DOMAIN_CERTIFICATE_ID }}
          bindingType: SniEnabled
      {{- end }}
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--blobs
        value: '{{ .Env.STORAGE_BLOBENDPOINT }}'
      - name: connectionstrings--fundingdb
        value: Server=tcp:{{ .Env.SQLSERVER_SQLSERVERFQDN }},1433;Encrypt=True;Authentication="Active Directory Default";Database=fundingdb
      - name: admin--defaultpassword
        value: '{{ .Env.Admin__DefaultPassword }}'
      - name: aicomparison--anthropic--apikey
        value: '{{ .Env.AiComparison__Anthropic__ApiKey }}'
  template:
    containers:
      - image: {{ .Image }}
        name: webapp
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_ENVIRONMENT
            value: Production
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          # Log-cost guard (PR #44): authoritative log levels at the Container App
          # config layer. Overrides appsettings.json and applies even if azd ships
          # a BuildKit-cache-stale image. EF "Executed DbCommand" at Information +
          # 1-5s worker polls were the Log Analytics ingestion spike.
          - name: Logging__LogLevel__Default
            value: Warning
          - name: Logging__LogLevel__Microsoft.AspNetCore
            value: Warning
          - name: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
            value: Warning
          - name: Logging__LogLevel__FundingPlatform.Infrastructure.Notifications
            value: Warning
          - name: Logging__LogLevel__FundingPlatform.Application.Services
            value: Information
          # Throttle background-worker DB polling (fewer queries = fewer log lines).
          - name: Notifications__Worker__PollIntervalSeconds
            value: "30"
          - name: AiComparison__WorkerIdleDelaySeconds
            value: "10"
          - name: AiComparison__Provider
            value: Anthropic
          - name: AiComparison__Anthropic__ApiKey
            secretRef: aicomparison--anthropic--apikey
          - name: AdminReports__CsvRowLimit
            value: "50000"
          - name: AdminReports__DefaultCurrency
            value: CRC
          # Ybug feedback widget (temporary). The view also requires
          # environment != Development, so local + E2E runs never load it.
          # Remove this entry to switch the widget off without a code change.
          - name: Ybug__Id
            value: rhpksjxja754ms2dy40z
          - name: Admin__DefaultPassword
            secretRef: admin--defaultpassword
          - name: BLOBS_URI
            value: '{{ .Env.STORAGE_BLOBENDPOINT }}'
          - name: FUNDINGDB_DATABASENAME
            value: fundingdb
          - name: FUNDINGDB_HOST
            value: '{{ .Env.SQLSERVER_SQLSERVERFQDN }}'
          - name: FUNDINGDB_JDBCCONNECTIONSTRING
            value: jdbc:sqlserver://{{ .Env.SQLSERVER_SQLSERVERFQDN }}:1433;database=fundingdb;encrypt=true;trustServerCertificate=false
          - name: FUNDINGDB_PORT
            value: "1433"
          - name: FUNDINGDB_URI
            value: mssql://{{ .Env.SQLSERVER_SQLSERVERFQDN }}:1433/fundingdb
          - name: FundingAgreement__CurrencyIsoCode
            value: CRC
          - name: FundingAgreement__LocaleCode
            value: es-CR
          - name: HTTP_PORTS
            value: "8080"
          - name: Notifications__Provider
            value: NoOp
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: SignedUpload__MaxSizeBytes
            value: "20971520"
          - name: Storage__AccountReference
            value: '{{ .Env.STORAGE_BLOBENDPOINT }}'
          - name: Storage__Provider
            value: AzureBlob
          - name: Storage__TestFallback__AllowFilesystem
            value: "false"
          - name: Syncfusion__LicenseKey
            value: Ngo9BigBOggjHTQxAR8/V1JHaF1cXmhMYVJpR2NbeU5xdF9DZVZURGY/P1ZhSXxVdkFhXX1cdXFQRmJVU019XEE=
          - name: ConnectionStrings__blobs
            secretRef: connectionstrings--blobs
          - name: ConnectionStrings__fundingdb
            secretRef: connectionstrings--fundingdb
    scale:
      minReplicas: 1
tags:
  azd-service-name: webapp
  aspire-resource-name: webapp
